<!DOCTYPE html>
<html class="staticrypt-html" lang="en">

        <title>/*[|template_title|]*/0</title>

        <meta name="theme-color" content="#07060d" />
        <link rel="icon" href="../favicon.ico" sizes="any" />

        <meta http-equiv="cache-control" content="max-age=0" />

        <style>
            .staticrypt-html,
            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-body {
                color: #f4f1ff;
                font-family: Inter, "Segoe UI", system-ui, sans-serif;
                -webkit-font-smoothing: antialiased;
            }

            .staticrypt-content {
                min-height: 100%;
                box-sizing: border-box;
                background:
                    radial-gradient(900px 520px at 12% -10%, rgba(65, 105, 225, 0.55), transparent 58%),
                    radial-gradient(720px 480px at 110% 8%, rgba(124, 58, 237, 0.42), transparent 55%),
                    /*[|template_color_secondary|]*/ 0;
            }

            .staticrypt-page {
                width: min(420px, calc(100% - 32px));
                margin: 0 auto;
                padding: 9vh 0 48px;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #100c18;
                border: 1px solid rgba(124, 58, 237, 0.55);
                border-radius: 18px;
                box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
                margin: 0 auto;
                padding: 32px 28px 28px;
                text-align: center;
                color: #f4f1ff;
            }

            .staticrypt-logo {
                display: block;
                height: 76px;
                width: auto;
                margin: 0 auto 18px;
            }

            .staticrypt-title {
                margin: 0 0 8px;
                font-size: 1.45rem;
                letter-spacing: -0.02em;
            }

            .staticrypt-instructions {
                margin: 0 0 18px;
                color: #c4b5fd;
                font-size: 0.95rem;
                line-height: 1.45;
            }

            .staticrypt-hr {
                margin: 0 0 18px;
                border: 0;
                border-top: 1px solid rgba(124, 58, 237, 0.35);
            }

            .staticrypt-password-container {
                position: relative;
                background: #181226;
                border: 1px solid #4c1d95;
                border-radius: 12px;
                margin: 0 0 14px;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                box-sizing: border-box;
                color: #ffffff;
                font: inherit;
                font-size: 16px;
                outline: 0;
                padding: 14px 46px 14px 14px;
                width: 100%;
            }

            .staticrypt-form input::placeholder {
                color: #a78bfa;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 0.75;
                padding: 12px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
                filter: invert(1);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                justify-content: flex-start;
                gap: 10px;
                margin: 0 0 16px;
                color: #ddd6fe;
                font-size: 0.92rem;
                text-align: left;
            }

            .staticrypt-remember input[type="checkbox"] {
                accent-color: /*[|template_color_primary|]*/ 0;
                width: 16px;
                height: 16px;
                margin: 0;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                background: /*[|template_color_primary|]*/ 0;
                border: 0;
                border-radius: 12px;
                color: #ffffff;
                cursor: pointer;
                font: inherit;
                font-weight: 700;
                letter-spacing: 0.02em;
                padding: 14px 16px;
                width: 100%;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                filter: brightness(1.08);
            }

            .staticrypt-error {
                min-height: 1.2em;
                margin: 12px 0 0;
                color: #fecaca;
                font-size: 0.9rem;
            }

            .staticrypt-back {
                margin: 18px 0 0;
                font-size: 0.9rem;
            }

            .staticrypt-back a {
                color: #a5b4fc;
                text-decoration: none;
            }

            .staticrypt-back a:hover {
                color: #ffffff;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                width: 2rem;
                height: 2rem;
                border: 0.25em solid #6d28d9;
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>

                    <p class="staticrypt-back"><a href="../">Back to Gradient Signs</a></p>
                </div>
            </div>
        </div>

                staticryptConfig = /*[|staticrypt_config|]*/ 0;

            const templateConfig = {
                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

                if (!isSuccessful) {
                    document.getElementById("staticrypt_loading").classList.add("hidden");

                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked,
                    errorEl = document.getElementById("staticrypt-error");

                errorEl.textContent = "";
                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    errorEl.textContent = templateError;
                    document.getElementById("staticrypt-password").focus();
                }
            });

</html>
