                transform: translateY(-50%);

                opacity: 0.7;

            .staticrypt-decrypt-button {
                width: 100%;
                padding: 0.9rem 1rem;
                border: 1px solid rgba(244, 240, 232, 0.4);
                background: transparent;
                color: #f4f0e8;
                font: inherit;
                font-size: 0.72rem;
                letter-spacing: 0.22em;
                text-transform: uppercase;
                cursor: pointer;
            }
            .staticrypt-decrypt-button:hover,
            .staticrypt-decrypt-button:focus { border-color: /*[|template_color_primary|]*/ 0; color: #ffffff; }

            .staticrypt-back { margin: 1.6rem 0 0; font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; }
            .staticrypt-back a { color: #a39c93; text-decoration: none; }
            .staticrypt-back a:hover { color: #f4f0e8; }
            .hidden { display: none !important; }

                border: 1px solid rgba(244, 240, 232, 0.25);
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.8s linear infinite;
            }
            @keyframes spinner-border { to { transform: rotate(360deg); } }

                    toggleIcon.alt = templateToggleAltHide;

                } else {

                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;

            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked,
                    errorEl = document.getElementById("staticrypt-error");

                errorEl.textContent = "";
