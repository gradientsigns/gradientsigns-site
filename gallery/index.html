<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Private gallery</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <meta name="theme-color" content="#07060d" />
        <link rel="icon" href="../favicon.ico" sizes="any" />

        <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />

        <style>
            .staticrypt-html,
            .staticrypt-body { height: 100%; margin: 0; }
            .staticrypt-body {
                color: #f4f0e8;
                font-family: Outfit, "Segoe UI", sans-serif;
                font-weight: 300;
                background: #080808;
            }
            .staticrypt-content {
                min-height: 100%;
                background:
                    radial-gradient(720px 380px at 50% -10%, rgba(65, 105, 225, 0.12), transparent 62%),
                    radial-gradient(480px 280px at 100% 100%, rgba(90, 70, 180, 0.08), transparent 60%),
                    #080808;
            }
            .staticrypt-page {
                width: min(440px, calc(100% - 2rem));
                margin: 0 auto;
                padding: 12vh 0 4rem;
            }
            .staticrypt-form { text-align: center; }
            .staticrypt-logo { height: 58px; width: auto; margin: 0 auto 2.2rem; }
            .staticrypt-kicker {
                margin: 0 0 0.8rem;
                font-size: 0.68rem;
                letter-spacing: 0.26em;
                text-transform: uppercase;
                color: #a39c93;
            }
            .staticrypt-title {
                margin: 0 0 0.9rem;
                font-family: "Cormorant Garamond", Georgia, serif;
                font-weight: 500;
                font-size: clamp(2.8rem, 6vw, 3.6rem);
                letter-spacing: -0.02em;
                line-height: 0.95;
            }
            .staticrypt-instructions {
                margin: 0 auto 2rem;
                max-width: 28rem;
                color: #a39c93;
                font-size: 0.98rem;
                line-height: 1.6;
            }
            .staticrypt-hr { margin: 0 0 1.6rem; border: 0; border-top: 1px solid rgba(244, 240, 232, 0.14); }
            .staticrypt-password-container { position: relative; margin: 0 0 1rem; border-bottom: 1px solid rgba(244, 240, 232, 0.28); }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                width: 100%;
                padding: 0.85rem 2.4rem 0.85rem 0;
                border: 0;
                background: transparent;
                color: #f4f0e8;
                font: inherit;
                font-size: 1rem;
                outline: none;
            }
            .staticrypt-form input::placeholder { color: #7d776f; }
            .staticrypt-toggle-password-visibility {
                position: absolute;
                right: 0;
                top: 50%;
                width: 18px;
                height: 18px;
                padding: 0;
                transform: translateY(-50%);
                cursor: pointer;
                opacity: 0.7;
                filter: invert(0.92);
            }
            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                margin: 0 0 1.4rem;
                color: #a39c93;
                font-size: 0.78rem;
                letter-spacing: 0.08em;
                text-align: left;
            }
            .staticrypt-remember input { accent-color: #4169E1; }
            .staticrypt-decrypt-button {
                width: 100%;
                padding: 0.9rem 1rem;
                border: 1px solid rgba(244, 240, 232, 0.4);
                background: transparent;
                color: #f4f0e8;
                font: inherit;
                font-size: 0.72rem;
                letter-spacing: 0.22em;
                text-transform: uppercase;
                cursor: pointer;
            }
            .staticrypt-decrypt-button:hover,
            .staticrypt-decrypt-button:focus { border-color: #4169E1; color: #ffffff; }
            .staticrypt-error { min-height: 1.2em; margin: 0.9rem 0 0; color: #e7c8c8; font-size: 0.85rem; }
            .staticrypt-back { margin: 1.6rem 0 0; font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; }
            .staticrypt-back a { color: #a39c93; text-decoration: none; }
            .staticrypt-back a:hover { color: #f4f0e8; }
            .hidden { display: none !important; }
            .staticrypt-spinner-container { height: 100vh; display: flex; align-items: center; justify-content: center; }
            .staticrypt-spinner {
                width: 1.4rem; height: 1.4rem;
                border: 1px solid rgba(244, 240, 232, 0.25);
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.8s linear infinite;
            }
            @keyframes spinner-border { to { transform: rotate(360deg); } }
        </style>
